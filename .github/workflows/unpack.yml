name: One-time unpack PR3 files
on:
  push:
    paths:
      - 'PR3_bundle.tar.xz'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand documents
        run: |
          set -euo pipefail
          tar -xJf PR3_bundle.tar.xz
          rm PR3_bundle.tar.xz
          rm .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add approved PR3 stages"
          git push
